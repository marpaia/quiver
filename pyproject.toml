[project]
name = "quiver"
version = "0.0.1"
description = "Machine learning for the diverse design of gene-regulatory circuits under a simulation objective."
requires-python = ">=3.11"
# Every dependency is required; quiver has no optional extras. torch runs the GFlowNet and its training,
# huggingface_hub saves and publishes trained designers, LOICA compiles a circuit to ODEs and runs the
# dose-response assay (pinned to the upstream commit that replaces DataFrame.append with pd.concat),
# matplotlib and pandas back the simulation objective and its figures, and flapjack-data supplies the shared
# characterization data model for measured dose-responses. pytest, black, isort, flake8, mypy, and pre-commit
# run the test and lint suite.
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
    "huggingface_hub>=0.23",
    "loica @ git+https://github.com/RudgeLab/LOICA.git@c2b65b30938f5f67a4fa215689efbb418510c422",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "flapjack-data @ file:///Users/marpaia/git/marpaia/flapjack-data",
    "pytest>=8",
    "black>=24",
    "isort>=5.13",
    "flake8>=7",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
quiver = "quiver.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quiver"]
# The research apparatus (baselines, evaluation harness, held-out failure models, experiments) validates the
# shipped strategy but is not part of the installed toolkit surface, so it is excluded from the built wheel.
exclude = ["quiver/research"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
# The research experiment scripts import their siblings (_common, _gfn, decorrelation_scaled) by bare name,
# run from their own directory rather than as a package, so they are excluded from strict type-checking (they
# are still formatted and linted by black/isort/flake8). The shipped toolkit and the research library modules
# (eval, baselines, objective failure models) remain strict-typed.
exclude = ["quiver/research/experiments/"]

[[tool.mypy.overrides]]
module = ["loica.*", "matplotlib.*", "pandas.*", "torch.*", "huggingface_hub.*"]
ignore_missing_imports = true

# The learned sampler builds on torch (untyped here); its correctness is covered by an integration test
# rather than strict typing.
[[tool.mypy.overrides]]
module = ["quiver.learn.*"]
ignore_errors = true

# The Bayesian-optimization baseline and the kinetics-manifold density are numpy/scipy-heavy; numpy's ufunc
# stubs return `Any` under strict mode (tripping no-any-return) and scipy ships no stubs. Their correctness is
# covered by tests rather than strict typing.
[[tool.mypy.overrides]]
module = ["quiver.research.baselines.bo", "quiver.research.manifold"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["sim: integration test that runs the LOICA simulation objective"]
